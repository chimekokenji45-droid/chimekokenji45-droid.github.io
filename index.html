<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Faucet - Earn & Withdraw USDT</title>

  <!-- Tailwind CSS & Cloudflare Turnstile -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <!-- PASTE POPADS CODE BELOW THIS LINE ONCE APPROVED -->

  <!-- PASTE POPADS CODE ABOVE THIS LINE ONCE APPROVED -->

  <style>
    body {
      background: radial-gradient(circle at 50% 0%, #0f172a 0%, #020617 100%);
      min-height: 100vh;
    }
  </style>
</head>
<body class="text-slate-100 flex flex-col items-center justify-between p-4 min-h-screen">

  <!-- HEADER & BALANCE DISPLAY -->
  <header class="w-full max-w-md flex items-center justify-between py-4">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-xl bg-cyan-500/20 border border-cyan-500/30 flex items-center justify-center text-cyan-400 font-bold">⚡</div>
      <div>
        <h1 class="font-extrabold text-base tracking-tight">NEXUS<span class="text-cyan-400">FAUCET</span></h1>
        <p class="text-[10px] text-slate-400">Earn & Withdraw USDT to FaucetPay</p>
      </div>
    </div>

    <div class="bg-slate-900/80 border border-slate-800 px-3 py-1.5 rounded-xl text-right">
      <div class="text-[9px] uppercase tracking-wider text-slate-400 font-bold">Unclaimed Balance</div>
      <div id="balanceDisplay" class="text-xs font-black text-cyan-400">0 USDT</div>
    </div>
  </header>

  <!-- MAIN DASHBOARD -->
  <main class="w-full max-w-md space-y-4 my-auto">
    <div id="statusBox" class="hidden transition-all rounded-xl p-4 border text-xs font-medium text-center"></div>

    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-5">
      
      <div>
        <label for="wallet" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
          FaucetPay Account Email / Address
        </label>
        <input 
          type="text" 
          id="wallet" 
          required 
          onblur="checkBalance()"
          placeholder="Enter FaucetPay address or email" 
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition"
        />
      </div>

      <!-- CAPTCHA WIDGET -->
      <div class="flex justify-center py-2">
        <div class="cf-turnstile" data-sitekey="0x4AAAAAAElyUDcSuYmcOyg-" data-theme="dark" data-callback="onCaptchaComplete"></div>
      </div>

      <!-- ACTION BUTTONS -->
      <div class="grid grid-cols-2 gap-3">
        <button 
          type="button" 
          onclick="handleAction('claim')" 
          id="claimBtn" 
          class="w-full bg-cyan-500 hover:bg-cyan-400 active:bg-cyan-600 disabled:bg-slate-800 disabled:text-slate-600 font-bold py-3 rounded-xl transition text-slate-950 text-xs uppercase tracking-wider"
        >
          Claim Reward
        </button>

        <button 
          type="button" 
          onclick="handleAction('withdraw')" 
          id="withdrawBtn" 
          class="w-full bg-slate-800 hover:bg-slate-700 active:bg-slate-800 border border-slate-700 font-bold py-3 rounded-xl transition text-cyan-400 text-xs uppercase tracking-wider"
        >
          Withdraw
        </button>
      </div>

      <!-- REFERRAL LINK BOX -->
      <div class="border-t border-slate-800 pt-4 space-y-2">
        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400">
          Your Referral Link (Earn 20% Commission)
        </label>
        <div class="flex gap-2">
          <input 
            type="text" 
            id="refLinkInput" 
            readonly 
            placeholder="Enter wallet above to generate link" 
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-400 focus:outline-none"
          />
          <button 
            type="button" 
            onclick="copyRefLink()" 
            class="bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold px-3 py-2 rounded-xl text-xs transition"
          >
            Copy
          </button>
        </div>
      </div>

    </div>
  </main>

  <footer class="w-full max-w-md text-center py-4 text-xs text-slate-500">
    <p>© 2026 Nexus Faucet. Minimum withdrawal: 1,000 USDT units.</p>
  </footer>

  <script>
    const BACKEND_API_URL = "https://script.google.com/macros/s/AKfycbw37GtUEZwRdU19Lkjy82N-f_KQUIol8Te189YeYGjFqwPHgqESZk048o8Fa0_vNfiY/exec";
    const COOLDOWN_SECONDS = 300; // 5 minutes
    let captchaToken = "";
    let referrerWallet = "";
    let timerInterval = null;

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      referrerWallet = urlParams.get('ref') || "";

      // Automatically reload saved wallet address and balance on page refresh
      const savedWallet = localStorage.getItem('nexus_saved_wallet');
      if (savedWallet) {
        document.getElementById('wallet').value = savedWallet;
        checkBalance();
      }

      checkCooldown();
    });

    function onCaptchaComplete(t) {
      captchaToken = t;
    }

    function checkCooldown() {
      const lastClaim = localStorage.getItem('nexus_last_claim');
      if (!lastClaim) return;

      const elapsed = Math.floor((Date.now() - parseInt(lastClaim)) / 1000);
      const remaining = COOLDOWN_SECONDS - elapsed;

      if (remaining > 0) {
        startTimer(remaining);
      } else {
        localStorage.removeItem('nexus_last_claim');
      }
    }

    function startTimer(seconds) {
      const claimBtn = document.getElementById('claimBtn');
      claimBtn.disabled = true;

      if (timerInterval) clearInterval(timerInterval);

      let timeLeft = seconds;
      timerInterval = setInterval(() => {
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        claimBtn.innerText = `WAIT ${mins}:${secs < 10 ? '0' : ''}${secs}`;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          claimBtn.disabled = false;
          claimBtn.innerText = "CLAIM REWARD";
          localStorage.removeItem('nexus_last_claim');
        }
        timeLeft--;
      }, 1000);
    }

    async function checkBalance() {
      const wallet = document.getElementById('wallet').value.trim();
      if (!wallet) return;

      // Save wallet locally so refresh retains user balance
      localStorage.setItem('nexus_saved_wallet', wallet);

      const baseUrl = window.location.origin + window.location.pathname;
      document.getElementById('refLinkInput').value = `${baseUrl}?ref=${wallet}`;

      try {
        const res = await fetch(BACKEND_API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'balance', wallet: wallet })
        });
        const data = await res.json();
        if (data.success) updateBalanceUI(data.balance);
      } catch (e) {
        console.error("Balance fetch error:", e);
      }
    }

    function copyRefLink() {
      const input = document.getElementById('refLinkInput');
      if (!input.value) return showStatus("Please enter your wallet address first.", "error");
      input.select();
      navigator.clipboard.writeText(input.value);
      showStatus("Referral link copied to clipboard!", "success");
    }

    async function handleAction(actionType) {
      const wallet = document.getElementById('wallet').value.trim();
      const claimBtn = document.getElementById('claimBtn');
      const withdrawBtn = document.getElementById('withdrawBtn');

      if (!wallet) return showStatus("Please enter your FaucetPay wallet address first.", "error");
      if (!captchaToken) return showStatus("Please solve the CAPTCHA check.", "error");

      // Save wallet on claim/withdraw action
      localStorage.setItem('nexus_saved_wallet', wallet);

      claimBtn.disabled = true;
      withdrawBtn.disabled = true;

      try {
        const response = await fetch(BACKEND_API_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: actionType,
            wallet: wallet,
            referrer: referrerWallet,
            captchaToken: captchaToken
          })
        });

        const data = await response.json();

        withdrawBtn.disabled = false;

        if (data.success) {
          showStatus(data.message, "success");
          if (data.balance !== undefined) updateBalanceUI(data.balance);

          if (actionType === 'claim') {
            localStorage.setItem('nexus_last_claim', Date.now().toString());
            startTimer(COOLDOWN_SECONDS);
          } else {
            claimBtn.disabled = false;
          }
        } else {
          claimBtn.disabled = false;
          showStatus(data.message, "error");
        }
      } catch (err) {
        claimBtn.disabled = false;
        withdrawBtn.disabled = false;
        showStatus("Server request failed. Please check network connection.", "error");
      } finally {
        if (window.turnstile) turnstile.reset();
        captchaToken = "";
      }
    }

    function updateBalanceUI(amount) {
      document.getElementById('balanceDisplay').innerText = `${amount.toLocaleString()} USDT`;
    }

    function showStatus(msg, type) {
      const box = document.getElementById('statusBox');
      box.classList.remove('hidden', 'bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400', 'bg-red-500/10', 'border-red-500/30', 'text-red-400');
      box.classList.add(type === 'success' ? 'bg-emerald-500/10' : 'bg-red-500/10');
      box.classList.add(type === 'success' ? 'border-emerald-500/30' : 'border-red-500/30');
      box.classList.add(type === 'success' ? 'text-emerald-400' : 'text-red-400');
      box.innerText = msg;
      box.classList.remove('hidden');
    }
  </script>
</body>
  </html>
